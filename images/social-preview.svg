<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Signal Academic Portfolio</title>
  <desc id="desc">A light academic portfolio banner with violet, blue, and cyan circuit accents.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9ff"/>
      <stop offset="0.56" stop-color="#f4f6fc"/>
      <stop offset="1" stop-color="#eef8fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7057ff"/>
      <stop offset="0.52" stop-color="#2e75f0"/>
      <stop offset="1" stop-color="#06aaa8"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f7fd"/>
      <stop offset="0.12" stop-color="#f5f7fd" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#f5f7fd" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="imageClip">
      <path d="M756 58h440c20 0 36 16 36 36v452c0 20-16 36-36 36H720V94l36-36z"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#paper)"/>
  <circle cx="138" cy="72" r="112" fill="#7057ff" opacity="0.045"/>
  <circle cx="1138" cy="558" r="156" fill="#00a9a7" opacity="0.065"/>

  <g fill="none" stroke="#9eb7e3" stroke-width="2" opacity="0.35">
    <path d="M44 526h118l44-44h108l48-48h104"/>
    <path d="M130 572h160l58-58h108"/>
    <path d="M452 74h112l44 44h104"/>
    <path d="M518 118h46l42 42h126"/>
    <circle cx="44" cy="526" r="7" fill="#f5f7fd"/>
    <circle cx="466" cy="434" r="7" fill="#f5f7fd"/>
    <circle cx="452" cy="74" r="7" fill="#f5f7fd"/>
    <circle cx="732" cy="160" r="7" fill="#f5f7fd"/>
  </g>
  <g fill="none" stroke="#4fd0d0" stroke-width="2" opacity="0.24">
    <path d="M24 552h108l36-36h90"/>
    <path d="M550 558h116l54-54h74"/>
  </g>

  <text x="72" y="82" fill="#6250ff" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="2.8">OPEN-SOURCE JEKYLL TEMPLATE</text>
  <rect x="72" y="110" width="510" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="68" y="232" fill="#111420" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="102" letter-spacing="-4">SIGNAL</text>
  <text x="72" y="304" fill="#111420" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="58" letter-spacing="-2">ACADEMIC PORTFOLIO</text>

  <text x="74" y="374" fill="#374052" font-family="Georgia, Times New Roman, serif" font-size="27">Interactive portfolio infrastructure</text>
  <text x="74" y="411" fill="#374052" font-family="Georgia, Times New Roman, serif" font-size="27">for researchers, students, and engineers.</text>

  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="0.8">
    <g transform="translate(72 474)">
      <rect width="170" height="44" rx="22" fill="#e9e6ff" stroke="#7057ff"/>
      <text x="85" y="28" text-anchor="middle" fill="#5d47e9">MARKDOWN FIRST</text>
    </g>
    <g transform="translate(256 474)">
      <rect width="184" height="44" rx="22" fill="#e8f0ff" stroke="#3278e9"/>
      <text x="92" y="28" text-anchor="middle" fill="#2f6fd0">DYNAMIC ARCHIVES</text>
    </g>
    <g transform="translate(454 474)">
      <rect width="152" height="44" rx="22" fill="#e3f7f6" stroke="#08a4a3"/>
      <text x="76" y="28" text-anchor="middle" fill="#078f8e">RESPONSIVE CV</text>
    </g>
  </g>

  <text x="74" y="580" fill="#576174" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1.3">MARKDOWN · YAML · GITHUB PAGES</text>

  <g clip-path="url(#imageClip)">
    <image x="720" y="58" width="512" height="524" preserveAspectRatio="xMidYMid slice" xlink:href="profile.png"/>
    <rect x="720" y="58" width="120" height="524" fill="url(#fade)"/>
  </g>
  <path d="M756 58h440c20 0 36 16 36 36v452c0 20-16 36-36 36H720V94l36-36z" fill="none" stroke="#bac7da" stroke-width="2"/>
  <circle cx="1180" cy="92" r="11" fill="#00c2c0" opacity="0.42" filter="url(#glow)"/>
  <circle cx="1180" cy="92" r="4" fill="#ccffff"/>
</svg>
