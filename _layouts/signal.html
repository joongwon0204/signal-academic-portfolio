---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 | default: 'en' }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    <link rel="stylesheet" href="{{ '/assets/css/signal.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body class="signal-site signal-site--{{ page.layout | default: 'page' }}">
    <a class="signal-skip" href="#signal-main">Skip to content</a>
    {% include signal-header.html %}

    <main id="signal-main" class="signal-main" role="main">
      {{ content }}
    </main>

    {% include signal-footer.html %}
    <script src="{{ '/assets/js/signal.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  </body>
</html>
